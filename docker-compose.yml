services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: test-repo-web:dev
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.50"
    mem_limit: 256M
    environment:
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
